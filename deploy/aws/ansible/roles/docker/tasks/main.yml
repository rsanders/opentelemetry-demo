---
# This AMI wires sshd to EC2 Instance Connect's AuthorizedKeysCommand
# (/opt/aws/bin/eic_run_authorized_keys), which fails (exit 255) in this
# account and, since OpenSSH treats a failing AuthorizedKeysCommand as fatal
# for that auth attempt, blocks *all* key-based SSH -- including the static
# authorized_keys file -- not just EIC's own ephemeral-key flow. Disable it
# since this deployment relies on static keys (Ansible/`make ssh`) and SSM,
# not EC2 Instance Connect.
- name: Disable the EC2 Instance Connect AuthorizedKeysCommand in sshd
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^(AuthorizedKeysCommand.*)$'
    replace: '#\1'
  register: sshd_config_changed

- name: Validate sshd config after edit
  ansible.builtin.command: sshd -t
  changed_when: false
  when: sshd_config_changed.changed

- name: Restart sshd if its config changed
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  when: sshd_config_changed.changed

- name: Install Docker Engine and supporting packages (Amazon Linux 2023 repo)
  ansible.builtin.dnf:
    name:
      - docker
      - git
      - rsync
    state: present

- name: Ensure Docker CLI plugin directory exists
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: "0755"

- name: Install docker compose plugin binary
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_plugin_version }}/docker-compose-linux-x86_64"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: "0755"

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add ec2-user to the docker group
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true

- name: Reset connection to pick up docker group membership
  ansible.builtin.meta: reset_connection
