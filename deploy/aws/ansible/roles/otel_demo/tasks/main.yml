---
- name: Ensure repo destination directory exists
  ansible.builtin.file:
    path: "{{ repo_dest }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Sync repository to the instance
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../../"
    dest: "{{ repo_dest }}"
    delete: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=deploy/aws/terraform/.terraform"
      - "--exclude=**/node_modules"
      - "--exclude=**/.next"
      - "--exclude=**/target"
      - "--exclude=**/__pycache__"
  become: false

- name: Render AWS exporters into the collector's extras seam
  ansible.builtin.template:
    src: otelcol-config-extras-aws.yml.j2
    dest: "{{ repo_dest }}/src/otel-collector/otelcol-config-extras.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"

- name: Deploy the AWS compose override (publishes frontend-proxy on :80)
  ansible.builtin.copy:
    src: compose.aws-override.yml
    dest: "{{ repo_dest }}/compose.aws-override.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"

- name: Pull compose images
  ansible.builtin.shell: "docker compose {{ compose_file_flags[compose_profile] }} -f compose.aws-override.yml pull"
  args:
    chdir: "{{ repo_dest }}"
  become_user: ec2-user
  environment:
    HOME: /home/ec2-user

- name: Start the demo stack
  # --force-recreate: several services (e.g. otel-collector) bind-mount config
  # files by host path, and that path never changes between deploys even when
  # the file's contents do -- only the container's *definition* (image, env,
  # mount source paths, command) is compared, so `up -d` alone would leave an
  # already-running container on its stale, already-loaded config.
  ansible.builtin.shell: "docker compose {{ compose_file_flags[compose_profile] }} -f compose.aws-override.yml up -d --remove-orphans --force-recreate"
  args:
    chdir: "{{ repo_dest }}"
  become_user: ec2-user
  environment:
    HOME: /home/ec2-user
