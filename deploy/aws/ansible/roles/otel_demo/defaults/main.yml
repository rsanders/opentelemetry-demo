---
fast_update: false

compose_environment:
  HOME: /home/ec2-user
  OTEL_SERVICE_VERSION: "{{ otel_service_version }}"
  # Stamped into every service's service.instance.id (see .env's
  # OTEL_RESOURCE_ATTRIBUTES_BASE) so telemetry can tell one deploy's run of
  # a service apart from the next. ansible_date_time is gathered once by
  # site.yml's pre_tasks, so every service in this deploy gets the same
  # value -- that's fine, service.name already makes the pair unique.
  DEPLOY_INSTANCE_ID: "{{ ansible_facts['date_time']['epoch'] }}"

# Services with a local Dockerfile that must win over "Pull compose images":
# ad/otel-collector wrap a pulled public image with a small deployment-specific
# layer (their Dockerfile uses that image as a base without rebuilding the
# application from source); load-generator's script.js has been extended
# with agent/mcp/chatbot scenarios (see src/load-generator/README.md) that
# don't exist in the upstream ghcr.io image `pull` would otherwise fetch, so
# it needs a full local build to actually take effect.
locally_extended_services:
  - ad
  - otel-collector
  - load-generator

# Services that bind-mount config files by host path (see compose.yaml):
# Compose only compares a container's *definition* (image, env, mount source
# paths, command), never bind-mounted file *content*, so a fast_update's
# plain `up -d` won't notice these changed on disk and must be told to
# force-recreate them explicitly.
bind_mount_services:
  - otel-collector
  - flagd
  - flagd-ui
  - product-catalog
