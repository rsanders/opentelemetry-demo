# Layered on top of the repo's src/otel-collector/otelcol-config.yml with a
# second --config flag, which is the demo's documented seam for adding
# exporters without editing upstream files. Map keys deep-merge; only
# conflicting array keys are replaced.
#
# Both files are written into the task by an init container at startup (see
# lib/otel-demo-ecs-stack.ts), so nothing under src/ is modified.
#
# Everything environment-specific comes in through ${env:...}, which the
# collector expands before parsing, so this file needs no templating.

receivers:
  # The base config hardcodes short Docker Compose hostnames for these two.
  # On ECS every service is reached through its Cloud Map FQDN instead.
  redis:
    endpoint: ${env:VALKEY_ADDR}
  prometheus/ad:
    config:
      scrape_configs:
        - job_name: ad
          scrape_interval: 10s
          static_configs:
            - targets: ["${env:AD_PROMETHEUS_ADDR}"]

processors:
  # Drops the `docker` detector: Fargate exposes no Docker socket, and a
  # failing detector stops the collector from starting. `ecs` replaces it,
  # reading the task metadata endpoint to add aws.ecs.* resource attributes.
  resourcedetection:
    detectors: [env, ecs, system]

exporters:
  awsxray:
    region: ${env:AWS_REGION}
  awsemf:
    region: ${env:AWS_REGION}
    namespace: OtelDemo
    log_group_name: '${env:OTELCOL_LOG_GROUP}'
    log_stream_name: 'metrics'
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: '${env:APP_LOG_GROUP}'
    log_stream_name: 'otel-collector'

service:
  pipelines:
    traces:
      exporters: [debug, span_metrics, awsxray]
    metrics:
      # Same as the base list minus docker_stats and host_metrics, neither of
      # which Fargate can serve -- no Docker socket, and no host filesystem to
      # mount at /hostfs.
      receivers: [otlp, span_metrics, http_check/frontend-proxy, nginx, redis, postgresql, prometheus/ad]
      exporters: [debug, awsemf]
    logs:
      exporters: [debug, awscloudwatchlogs]